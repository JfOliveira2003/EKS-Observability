apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
spec:
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
        - name: postgresql
          image: postgres:15.0
          env:
            - name: POSTGRES_PASSWORD
              value: "Pg#123"
            - name: POSTGRES_USER
              value: "kubenews"
            - name: POSTGRES_DB
              value: "kubenews"
            - name: DATA_SOURCE_NAME
              value: "postgresql://kubenews:Pg#123@localhost:5432/kubenews?sslmode=disable"
          ports:
            - containerPort: 5432

        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
          env:
            # The exporter uses this env var to find the database.
            - name: DATA_SOURCE_NAME
              value: "postgresql://kubenews:Pg#123@localhost:5432/kubenews?sslmode=disable"
          ports:
            - containerPort: 9187
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
spec:
  selector:
    app: postgresql
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s
spec:
  replicas: 5
  selector:
    matchLabels:
      app: k8s
  template:
    metadata:
      labels:
        app: k8s
    spec:
      containers:
        - name: k8s
          image: fabricioveronez/kube-news:v1
          ports:
            - containerPort: 8080
          env:
            - name: DB_DATABASE
              value: "kubenews"
            - name: DB_USERNAME
              value: "kubenews"
            - name: DB_PASSWORD
              value: "Pg#123"
            - name: DB_HOST
              value: "postgresql"
---
apiVersion: v1
kind: Service
metadata:
  name: app-svc
spec:
  selector:
    app: k8s
  ports:
    - port: 80
      targetPort: 8080
